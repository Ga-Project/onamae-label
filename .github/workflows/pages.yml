name: Deploy to GitHub Pages

# 秘密スキャン → テスト → ビルド → Pages 公開を1つの workflow で直列化する。
# 前段が落ちたら build は skip され、Pages には何も公開されない。

on:
  push:
    branches: [main]

# 最小権限。書き込みが要るのは deploy job のみ（下で job 単位に付与）。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 平文シークレットの混入を全コミット履歴に対して検査する。
  # build はこの job を needs にするため、ここで落ちると公開に進まない。
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全コミット履歴を走査する
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --no-banner --redact

  # ---------------------------------------------------------------------------
  # 面付けエンジン・シート規格・配信 URL 組み立ての単体テストと、型・lint を
  # build より前に見る。落ちる時は早く落とす。build はこの job も needs にする
  # ため、赤ければ公開に進まない。
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 下限は .nvmrc で一元管理する（テストが Node の TS 型ストリップに依存し、
          # 既定で有効なのは 22.18.0 以降。`node-version: 22` だと下限が表明されない）。
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint

  build:
    name: Build (static export)
    needs: [secret-scan, test] # 前段の通過が前提。fail 時は skip され公開されない。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 下限は .nvmrc で一元管理する（テストが Node の TS 型ストリップに依存し、
          # 既定で有効なのは 22.18.0 以降。`node-version: 22` だと下限が表明されない）。
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # プロジェクトページ（<owner>.github.io/onamae-label/）へサブパス配信するため basePath を注入。
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /onamae-label
      # 書き出した out/ そのものを検査する。純関数のテストは「配線が切れた」ことを
      # 検出できない（layout が siteUrl を呼ばなくなっても緑のまま通る）ので、
      # 公開される成果物に対して不変条件を突き合わせる。
      # env は渡さない。verify:out の期待値は package.json の name から導くのが
      # 不変条件で、env を並べると「検査は env で駆動される」という誤解が
      # ワークフローの見た目の上で復活する（それは今回取り除いた不具合そのもの）。
      - run: pnpm verify:out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
